            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="he">עברית</option>
            <option value="ru">Русский</option>
          </select>

          <button
            onClick={() => setDark(!dark)}
            className={`w-11 h-6 rounded-full transition relative ${dark ? "bg-primary-600" : "bg-gray-300"}`}
          >
            <span className={`absolute top-0.5 w-5 h-5 bg-white rounded-full transition ${dark ? "left-5" : "left-0.5"}`} />
          </button>
        </div>
      </header>

      {/* ===== MAIN CONTENT ===== */}
      <main className="flex-1 overflow-y-auto p-4">

        {/* DRAW TAB (temporary placeholder) */}
        {activeTab === "draw" && (
          <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 text-center">
            <h2 className="text-xl font-bold mb-2">{t.setup}</h2>
            <p className="text-gray-500">Draw tab will come here</p>
          </div>
        )}

        {/* TICKETS TAB (temporary placeholder) */}
        {activeTab === "tickets" && (
          <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 text-center">
            <h2 className="text-xl font-bold mb-2">{t.history}</h2>
            <p className="text-gray-500">Tickets tab will come here</p>
          </div>
        )}

        {/* SUPPORT TAB (working) */}
        {activeTab === "support" && (
          <div className="space-y-4">
            {/* Be a Tester */}
            <div className="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow">
              <h2 className="text-lg font-bold mb-2">{t.beTester}</h2>
              <p className="text-sm text-gray-500 dark:text-gray-400 mb-4">{t.testerPitch}</p>

              <label className="block mb-3">
                <span className="text-sm text-gray-500">{t.testerCountry}</span>
                <select
                  value={testerCountry}
                  onChange={(e) => setTesterCountry(e.target.value)}
                  className="mt-1 w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"
                >
                  <option value="">— select —</option>
                  <option value="DE">Germany (DE)</option>
                  <option value="NL">Netherlands (NL)</option>
                  <option value="US">United States (US)</option>
                  <option value="MX">Mexico (MX)</option>
                  <option value="AT">Austria (AT)</option>
                  <option value="CH">Switzerland (CH)</option>
                  <option value="GB">United Kingdom (GB)</option>
                  <option value="FR">France (FR)</option>
                  <option value="ES">Spain (ES)</option>
                  <option value="IT">Italy (IT)</option>
                  <option value="PL">Poland (PL)</option>
                  <option value="CA">Canada (CA)</option>
                  <option value="AU">Australia (AU)</option>
                  <option value="ZA">South Africa (ZA)</option>
                </select>
              </label>

              <label className="block mb-3">
                <span className="text-sm text-gray-500">{t.testerGmail}</span>
                <input
                  type="email"
                  value={testerGmail}
                  onChange={(e) => setTesterGmail(e.target.value)}
                  className="mt-1 w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"
                />
              </label>

              <label className="block mb-4">
                <span className="text-sm text-gray-500">{t.testerIdea}</span>
                <textarea
                  value={testerNote}
                  onChange={(e) => setTesterNote(e.target.value)}
                  rows={2}
                  className="mt-1 w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700"
                />
              </label>

              <button
                onClick={emailTester}
                className="w-full py-3 rounded-xl bg-amber-600 hover:bg-amber-700 text-white font-semibold"
              >
                {t.testerSend}
              </button>
            </div>

            {/* Support & Web */}
            <div className="bg-white dark:bg-gray-800 rounded-2xl p-5 shadow space-y-3">
              <a
                href="mailto:riacht+lotty@gmail.com?subject=Lottery%20Number%20Picker%20Support"
                className="block w-full text-center py-3 rounded-xl bg-gray-200 dark:bg-gray-700 font-medium"
              >
                {t.support}
              </a>

              <a
                href="https://riacht.github.io/lotty-web/"
                target="_blank"
                rel="noopener noreferrer"
                className="block w-full text-center py-3 rounded-xl bg-primary-600 text-white font-medium"
              >
                {t.openWeb}
              </a>
            </div>
          </div>
        )}
      </main>

      {/* ===== BOTTOM TABS ===== */}
      <nav className="sticky bottom-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex">
        <button
          onClick={() => setActiveTab("draw")}
          className={`flex-1 py-3 flex flex-col items-center text-xs font-medium ${
            activeTab === "draw" ? "text-primary-600" : "text-gray-500"
          }`}
        >
          <span className="text-xl">🎲</span>
          <span>{t.setup}</span>
        </button>

        <button
          onClick={() => setActiveTab("tickets")}
          className={`flex-1 py-3 flex flex-col items-center text-xs font-medium ${
            activeTab === "tickets" ? "text-primary-600" : "text-gray-500"
          }`}
        >
          <span className="text-xl">🎫</span>
          <span>{t.history}</span>
        </button>

        <button
          onClick={() => setActiveTab("support")}
          className={`flex-1 py-3 flex flex-col items-center text-xs font-medium ${
            activeTab === "support" ? "text-primary-600" : "text-gray-500"
          }`}
        >
          <span className="text-xl">💬</span>
          <span>{t.support}</span>
        </button>
      </nav>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
