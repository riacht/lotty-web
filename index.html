      const secureRandomInt = (maxExclusive) => {
        if (maxExclusive <= 0) return 0;
        const range = maxExclusive;
        const arr = new Uint32Array(1);
        const max = Math.floor(0x100000000 / range) * range;
        let x;
        do {
          crypto.getRandomValues(arr);
          x = arr[0];
        } while (x >= max);
        return x % range;
      };

      const shuffle = (arr) => {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = secureRandomInt(i + 1);
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };

      const addPhotoToTicket = (ticketId, dataUrl) => {
        const updated = tickets.map(tk =>

        saveTickets(updated);

      const removePhoto = (ticketId) => {

        setTickets(updated);
        saveTickets(updated);

      const onPhotoSelected = (ticketId, file) => {

        reader.onload = () => addPhotoToTicket(ticketId, reader.result);
        reader.readAsDataURL(file);
      };

      const runCompare = (ticket) => {
        const parts = officialInput
          .split(/[\s,;.]+/)
          .map(s => parseInt(s, 10))
          .filter(n => !isNaN(n));
        const mainSet = new Set(ticket.mainNums);
        const bonusSet = new Set(ticket.bonusNums || []);
        let mainHits = 0, bonusHits = 0;
        const seen = new Set();
        parts.forEach(n => {
          if (seen.has(n)) return;
          seen.add(n);
          if (mainSet.has(n)) mainHits++;
          else if (bonusSet.has(n)) bonusHits++;
        });
        setMatchResult({ mainHits, bonusHits, total: mainHits + bonusHits, entered: parts });
      };

      const startDrawing = () => {
        const digits = selectedGame && selectedGame.digitMode;
        if (!digits && (mainCount < 1 || mainMax < mainCount)) {
          alert("Invalid main numbers settings");
          return;
        }
        setMainPool(digits ? [] : shuffle(Array.from({ length: mainMax }, (_, i) => i + 1)));
        setMainNums([]);
        setBonusNums([]);
        setPhase("main");
        setMessage("");
        setSavedThisDraw(false);
        setView("draw");

      const drawNext = () => {
        if (phase === "main" && selectedGame && selectedGame.digitMode) {
          const lo = selectedGame.digitMin ?? 0;
          const hi = selectedGame.digitMax ?? 9;
          const next = lo + secureRandomInt(hi - lo + 1);
          const updated = [...mainNums, next];
          setMainNums(updated);
          if (updated.length >= mainCount) setPhase(bonusCount > 0 ? "bonus" : "done");
          return;
        }
        if (phase === "main") {
          if (mainPool.length === 0) return;
          const next = mainPool[0];
          const updated = [...mainNums, next].sort((a, b) => a - b);
          setMainPool(mainPool.slice(1));
          setMainNums(updated);
          if (updated.length >= mainCount) {
            setPhase(bonusCount > 0 ? "bonus" : "done");

              .filter(n => !mainNums.includes(n) && !bonusNums.includes(n));
            if (remaining.length === 0) return;
            next = remaining[secureRandomInt(remaining.length)];
          } else {
            next = bonusMin + secureRandomInt(bonusMax - bonusMin + 1);

          const updated = [...bonusNums, next];
          setBonusNums(updated);

                <div className="text-sm mb-2">{t.officialNumbers}</div>
                <input type="text" value={officialInput} onChange={e => setOfficialInput(e.target.value)}
                  placeholder="e.g. 3 12 19 27 34 41"
                  className="w-full px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-sm mb-2" />
                <div className="flex gap-2">
                  <button onClick={() => runCompare(tk)}
                    className="px-3 py-1.5 rounded-lg bg-emerald-600 text-white text-sm">{t.compare}</button>
                  <button onClick={() => { setCheckTicketId(null); setMatchResult(null); }}
                    className="px-3 py-1.5 rounded-lg bg-gray-200 dark:bg-gray-700 text-sm">{t.close}</button>
                </div>
                {matchResult && (
                  <div className="mt-3 text-sm">
                    {matchResult.total > 0 ? (
                      <div className="text-green-600 dark:text-green-400 font-semibold">
                        🙂 {t.youWon} ({t.matches}: {matchResult.mainHits}
                        {matchResult.bonusHits > 0 ? ` + ${matchResult.bonusHits} bonus` : ""})
                      </div>
                    ) : (
                      <div className="text-gray-500">😐 {t.noMatch}</div>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>
        );

        let body;
        if (tickets.length === 0) {
          body = <p className="text-center text-gray-500 mt-12">{t.noTickets}</p>;
        } else if (!histNav) {
          body = (
            <div className="space-y-2">
              <div className="text-sm text-gray-500 mb-2">{t.byLottery}</div>
              {lotteryNames.map(name => {
                const count = Object.values(byLottery[name]).reduce((a, arr) => a + arr.length, 0);
                return (
                  <button key={name} onClick={() => setHistNav({ lottery: name })}
                    className="w-full text-left px-4 py-3 rounded-xl bg-white dark:bg-gray-800 shadow flex justify-between items-center">
                    <span className="font-medium">{name}</span>
                    <span className="text-sm text-gray-500">{count} {t.tickets}</span>
                  </button>
                );
              })}
            </div>
          );
        } else if (histNav.lottery && !histNav.day && !histNav.ticketId) {
          const days = Object.keys(byLottery[histNav.lottery] || {}).sort().reverse();
          body = (
            <div className="space-y-2">
              <button onClick={() => setHistNav(null)} className="text-sm text-primary-600 dark:text-primary-400 mb-2">← {t.byLottery}</button>
              <div className="font-semibold mb-2">{histNav.lottery}</div>
              <div className="text-sm text-gray-500 mb-2">{t.byDate}</div>
              {days.map(day => (
                <button key={day} onClick={() => setHistNav({ lottery: histNav.lottery, day })}
                  className="w-full text-left px-4 py-3 rounded-xl bg-white dark:bg-gray-800 shadow flex justify-between items-center">
                  <span>{day}</span>
                  <span className="text-sm text-gray-500">{byLottery[histNav.lottery][day].length} {t.tickets}</span>
                </button>
              ))}
            </div>
          );
        } else if (histNav.lottery && histNav.day && !histNav.ticketId) {
          const list = (byLottery[histNav.lottery] || {})[histNav.day] || [];
          body = (
            <div className="space-y-3">
              <button onClick={() => setHistNav({ lottery: histNav.lottery })} className="text-sm text-primary-600 dark:text-primary-400 mb-2">← {histNav.lottery}</button>
              <div className="font-semibold mb-2">{histNav.lottery} · {histNav.day}</div>
              {list.map(tk => (
                <button key={tk.id} onClick={() => setHistNav({ lottery: histNav.lottery, day: histNav.day, ticketId: tk.id })}
                  className="w-full text-left px-4 py-3 rounded-xl bg-white dark:bg-gray-800 shadow mb-2 flex justify-between">
                  <span className="text-sm">{new Date(tk.date).toLocaleTimeString()} · {(tk.mainNums || []).join(", ")}</span>
                  <span className="text-xs text-primary-600">{t.openTicket}</span>
                </button>
              ))}
            </div>
          );
        } else if (histNav.ticketId) {
          const tk = tickets.find(x => x.id === histNav.ticketId);
          body = (
            <div className="space-y-3">
              <button onClick={() => setHistNav({ lottery: histNav.lottery, day: histNav.day })}
                className="text-sm text-primary-600 dark:text-primary-400 mb-2">← {histNav.day}</button>
              {tk ? renderTicketCard(tk) : <p className="text-gray-500">—</p>}
            </div>
          );
        }

        return (
          <div className="max-w-md mx-auto p-4 min-h-screen">
            <header className="flex justify-between items-center mb-6 pt-2">
              <button onClick={() => { setView("setup"); setHistNav(null); }} className="text-primary-600 dark:text-primary-400">← {t.back}</button>
              <h1 className="text-lg font-bold">{t.history}</h1>
              <button onClick={clearAllTickets} className="text-sm text-red-500">{t.clearHistory}</button>
            </header>
            {body}
          </div>
        );
      }

      if (view === "settings") {
        return (
          <div className="max-w-md mx-auto p-4 min-h-screen">
            <header className="flex items-center mb-6 pt-2">
              <button onClick={() => setView("setup")} className="text-primary-600 dark:text-primary-400 mr-4">← {t.back}</button>
              <h1 className="text-lg font-bold">{t.settings}</h1>
            </header>
            <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow space-y-6">
              <div>
                <label className="block text-sm text-gray-500 dark:text-gray-400 mb-2">{t.language}</label>
                <select value={lang} onChange={e => setLang(e.target.value)}
                  className="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700">
                  <option value="en">English</option>
                  <option value="de">Deutsch</option>
                  <option value="es">Español</option>
                </select>
              </div>
              <div className="flex items-center justify-between">
                <span>{t.darkMode}</span>
                <button onClick={() => setDark(!dark)}
                  className={`w-14 h-8 rounded-full transition relative ${dark ? "bg-primary-600" : "bg-gray-300"}`}>
                  <span className={`absolute top-1 w-6 h-6 bg-white rounded-full transition ${dark ? "left-7" : "left-1"}`} />
                </button>
              </div>
              <div className="border-t border-gray-200 dark:border-gray-700 pt-4 space-y-2">
                <div className="text-sm font-medium mb-1">{t.webVersion}</div>
                <p className="text-xs text-gray-500 dark:text-gray-400 mb-2">{t.shareHint}</p>
                <a href={WEB_APP_URL} target="_blank" rel="noopener noreferrer"
                  className="block w-full text-center py-3 rounded-xl bg-primary-600 text-white font-medium">
                  {t.openWeb}
                </a>
                <button type="button" onClick={copyWebLink}
                  className="block w-full text-center py-3 rounded-xl bg-gray-200 dark:bg-gray-700 font-medium">
                  {t.copyLink}
                </button>
                {linkMsg && <div className="text-xs text-center text-green-600 dark:text-green-400">{linkMsg}</div>}
                <div className="text-xs text-gray-500 text-center break-all">{WEB_APP_URL}</div>
              </div>

              <div className="border-t border-gray-200 dark:border-gray-700 pt-4">
                <a href="mailto:support@example.com?subject=Lottery%20Number%20Picker%20Support"
                  className="block w-full text-center py-3 rounded-xl bg-gray-200 dark:bg-gray-700 font-medium">
                  {t.support}
                </a>
                <div className="text-xs text-gray-500 text-center mt-2">support@example.com</div>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
